; Per-user supervisord: runs as the user who starts it, with no root and no system
; config. Socket, pid and logs live in ~/.local/state/supervisor, which must exist
; before supervisord starts - it does not create it.
[supervisord]
logfile=%(ENV_HOME)s/.local/state/supervisor/supervisord.log
pidfile=%(ENV_HOME)s/.local/state/supervisor/supervisord.pid

[unix_http_server]
file=%(ENV_HOME)s/.local/state/supervisor/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_HOME)s/.local/state/supervisor/supervisor.sock

; One [program:x] file per service; the path is relative to this file.
[include]
files = conf.d/*.conf

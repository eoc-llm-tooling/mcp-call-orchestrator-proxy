; Program for the per-user supervisord in supervisord.conf. __REPO_ROOT__ is filled
; in by the install step in docs/deployment.md.
[program:mcp-call-orchestrator-proxy]
directory=__REPO_ROOT__
; supervisord has no EnvironmentFile=: sh exports the env file, then exec replaces the
; shell so stop signals reach the proxy itself. A missing env file fails the start.
command=sh -c 'set -a; . "%(ENV_HOME)s/.config/mcp-call-orchestrator-proxy/mcp-call-orchestrator-proxy.env"; exec "__REPO_ROOT__/.venv/bin/mcp-call-orchestrator-proxy" run --transport streamable-http'
autostart=true
autorestart=unexpected
startsecs=5
stopsignal=TERM
; The resilience layer's shutdown is prompt by design (interruptible backoff), so a
; short wait before SIGKILL is enough.
stopwaitsecs=10
; No stopasgroup/killasgroup: the MCP SDK starts a stdio backend in its own session,
; outside the proxy's process group, so a group signal never reaches it. The backend
; exits when its stdin closes, which happens when the proxy stops or dies.
stdout_logfile=%(ENV_HOME)s/.local/state/supervisor/%(program_name)s.log
redirect_stderr=true
